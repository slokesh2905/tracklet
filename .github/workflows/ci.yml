name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # The build never connects to a database; auth only needs a non-default secret.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema (no un-generated changes)
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          test -z "$(git status --porcelain -- drizzle)" || { echo "::error::lib/db/schema.ts changed without a migration. Run npm run db:generate."; exit 1; }
        env:
          DATABASE_URL: postgres://unused@localhost/unused
      - run: npm run build

  e2e:
    name: E2E (desktop + iPhone + Pixel) against Postgres
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracklet
          POSTGRES_PASSWORD: tracklet
          POSTGRES_DB: tracklet
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tracklet"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Global setup migrates + seeds the database before the tests run.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
